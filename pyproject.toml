[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slicechat-encoder"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "einops>=0.8.1",
  "flash-attn==2.8.3.post1+cu.12.6.torch.2.9",
  "fsspec>=2025.5.1",
  "ftfy>=6.3.1",
  "h5py>=3.15.1",
  "huggingface-hub>=0.33.2",
  "pandas>=2.3.0",
  "pytest>=8.4.1",
  "pytest-split>=0.10.0",
  "regex>=2024.11.6",
  "safetensors>=0.5.3",
  "timm>=1.0.10",
  "torch==2.9.1+cu126",
  "torchvision==0.24.1+cu126",
  "tqdm>=4.67.1",
  "transformers[sentencepiece]==4.53.1",
  "wandb>=0.21.0",
  "causal-conv1d>=1.6.1",
  "mamba-ssm>=2.3.2",
  "tensorboard>=2.21.0",
]

[tool.uv.sources]
torch       = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
flash-attn    = { index = "astral-cu126" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.1.post4/causal_conv1d-1.6.1+cu12torch2.9cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }
mamba-ssm     = { url = "https://github.com/state-spaces/mamba/releases/download/v2.3.1/mamba_ssm-2.3.1+cu12torch2.9cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }


[[tool.uv.index]]
name     = "pytorch-cu126"
url      = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name     = "astral-cu126"
url      = "https://wheels.astral.sh/simple/cu126/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/slicechat_encoder"]
